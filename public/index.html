<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DotAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DotAI <small>ドット絵ジェネレーター</small></h1>
    <div class="header-right">
      <span id="providerBadge" class="badge"></span>
      <button id="openSettings">⚙ 設定</button>
    </div>
  </header>

  <main>
    <!-- 左: 生成設定 -->
    <section class="panel left">
      <div class="left-scroll">
        <details class="sec" open>
          <summary>何を描く？</summary>
          <label>テンプレート
            <select id="template"></select>
          </label>
          <div id="templateFields"></div>
          <label>プロンプト <span class="hint">テンプレから自動作成・直接編集も可</span>
            <textarea id="prompt" rows="4" placeholder="例: 剣を持った勇者、正面向き"></textarea>
          </label>
        </details>

        <details class="sec" open>
          <summary>サイズと色</summary>
          <div id="sizePresets" class="chips"></div>
          <div class="row">
            <label class="inline">幅 <input id="width" type="number" min="4" max="128" value="32"></label>
            <label class="inline">高さ <input id="height" type="number" min="4" max="128" value="32"></label>
            <label class="check"><input id="square" type="checkbox" checked> 正方形</label>
          </div>
          <label>パレット
            <select id="palette"></select>
          </label>
          <div id="paletteSwatches" class="swatches small"></div>
          <label>最大色数 <output id="maxColorsOut">16</output>
            <input id="maxColors" type="range" min="2" max="32" value="16">
          </label>
        </details>

        <details class="sec">
          <summary>スタイル</summary>
          <div class="checks">
            <label class="check"><input id="stTransparent" type="checkbox" checked> 背景透過</label>
            <label class="check"><input id="stSymmetry" type="checkbox"> 左右対称</label>
            <label class="check"><input id="stOutline" type="checkbox" checked> 輪郭線</label>
            <label class="check"><input id="stTileable" type="checkbox"> タイル（繋ぎ目なし）</label>
            <label class="check"><input id="stDither" type="checkbox"> ディザリング</label>
          </div>
        </details>

        <details class="sec">
          <summary>アニメーション</summary>
          <label>動き
            <input id="motion" type="text" list="motionPresets" placeholder="例: 歩く（足を交互に出す）">
            <datalist id="motionPresets">
              <option value="待機（呼吸で体が少し上下する）">
              <option value="歩く（足を交互に出す）">
              <option value="走る">
              <option value="ジャンプ（しゃがむ→跳ぶ→着地）">
              <option value="攻撃（武器を振る）">
              <option value="ダメージを受けてのけぞる">
              <option value="ゆらゆら揺れる">
              <option value="光る・きらめく">
              <option value="回転する">
              <option value="炎が揺らめく">
              <option value="水面が波打つ">
            </datalist>
          </label>
          <label class="inline">コマ数
            <select id="frameCount">
              <option>2</option><option>3</option><option selected>4</option><option>6</option><option>8</option>
            </select>
          </label>
          <button id="animate" class="wide" title="キャンバスの今のコマを1コマ目として、残りのコマをAIが作ります。今あるコマは置き換わります（Ctrl+Zで戻せます）">🎞 今の絵からアニメを生成</button>
        </details>
      </div>

      <div class="left-footer">
        <div class="row">
          <label class="inline">案の数
            <select id="variations" title="複数案は並列で生成します。案の数だけ料金がかかります">
              <option selected>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option>
            </select>
          </label>
          <button id="refine" title="プロンプトを修正指示として、今キャンバスにある絵を作り直します">✏ 今の絵を修正</button>
        </div>
        <button id="generate" class="primary">✨ 生成する</button>
        <div id="status" class="status"></div>
      </div>
    </section>

    <!-- 中央: キャンバス -->
    <section class="center">
      <div class="toolbar">
        <div class="menu">
          <button class="menu-btn">ファイル ▾</button>
          <div class="menu-list">
            <button id="newCanvas">新規キャンバス（今のサイズ設定）</button>
            <label class="menu-item">画像を読み込む…<input id="importFile" type="file" accept="image/*" hidden></label>
          </div>
        </div>
        <div class="group" id="tools">
          <button data-tool="pen" class="active" title="ペン (B)">✎ ペン</button>
          <button data-tool="eraser" title="消しゴム (E)　※右クリックでも消せます">⌫ 消しゴム</button>
          <button data-tool="fill" title="塗りつぶし (G)">▨ 塗り</button>
          <button data-tool="picker" title="スポイト (I)">⦿ スポイト</button>
          <button data-tool="line" title="直線定規 (L)　クリックで点を打ち続け、ダブルクリック（Enter）で確定。Shiftで0°/45°/90°に固定、Backspaceで1点戻す、Escで取り消し">╱ 直線</button>
          <button data-tool="curve" title="曲線定規 (C)　クリックで点を打ち続けると全点を通る曲線になり、ダブルクリック（Enter）で確定。Backspaceで1点戻す、Escで取り消し">⌒ 曲線</button>
        </div>
        <div class="group">
          <button id="mirrorDraw" title="左右対称に描く (M)">⇋ 対称</button>
          <button id="toggleGrid" class="active" title="グリッド表示">＃ グリッド</button>
        </div>
        <div class="menu">
          <button class="menu-btn">加工 ▾</button>
          <div class="menu-list">
            <label class="menu-item check"><input id="opAllFrames" type="checkbox" checked> 全コマに適用（反転・輪郭・背景）</label>
            <hr>
            <button data-op="mirror">左半分を右へ反映</button>
            <button data-op="flip">左右反転</button>
            <button data-op="outline">輪郭線を追加</button>
            <button data-op="removeBg">背景を透明に</button>
            <hr>
            <button data-op="reduce">最大色数まで減色</button>
            <button data-op="mapPalette">選択中のパレットに合わせる</button>
            <button data-op="resize">今のサイズ設定にリサイズ</button>
          </div>
        </div>
        <div class="group">
          <button id="zoomOut" title="縮小">－</button>
          <button id="zoomIn" title="拡大">＋</button>
          <button id="undo" title="元に戻す (Ctrl+Z)">↶</button>
          <button id="redo" title="やり直す (Ctrl+Y)">↷</button>
        </div>
        <span id="canvasInfo" class="info"></span>
      </div>
      <div class="canvas-area">
        <canvas id="canvas"></canvas>
      </div>
      <div class="frames-bar">
        <span class="label">コマ</span>
        <div id="frameList" class="frame-list"></div>
        <div class="group">
          <button id="addFrame" title="今のコマを複製して後ろに追加">＋複製</button>
          <button id="addEmptyFrame" title="空のコマを後ろに追加">＋空</button>
          <button id="moveFrameLeft" title="前へ移動">◀</button>
          <button id="moveFrameRight" title="後ろへ移動">▶</button>
          <button id="deleteFrame" title="今のコマを削除">削除</button>
          <button id="onion" title="前のコマを薄く表示（オニオンスキン）">👻</button>
        </div>
        <label class="inline" title="アニメーションの再生速度（1秒あたりのコマ数）">FPS <input id="fps" type="number" min="1" max="30" value="8"></label>
      </div>
    </section>

    <!-- 右: パレット・プレビュー・保存・履歴 -->
    <section class="panel right">
      <h2>描画色</h2>
      <div id="editorPalette" class="swatches"></div>
      <div class="row">
        <input id="colorEdit" type="color" title="選択中の色を変更">
        <button id="addColor">＋色を追加</button>
        <button id="cleanPalette" title="使っていない色を削除">未使用色を削除</button>
      </div>

      <h2>プレビュー <label class="check inline-small"><input id="tilePreviewToggle" type="checkbox"> タイル3×3</label></h2>
      <div class="preview-box"><canvas id="preview"></canvas></div>

      <div id="candidatesSection" hidden>
        <h2>候補 <span class="hint">クリックで編集（全案を履歴にも保存済み）</span></h2>
        <div id="candidates" class="history"></div>
      </div>

      <h2>書き出し</h2>
      <div class="row">
        <label class="inline">倍率
          <select id="exportScale">
            <option>1</option><option>2</option><option>4</option><option selected>8</option><option>16</option>
          </select>
        </label>
        <label class="inline" title="スプライトシートの列数。0なら横一列">列数 <input id="sheetCols" type="number" min="0" max="64" value="0"></label>
      </div>
      <div class="btn-grid">
        <button id="downloadPng" title="今のコマだけをPNGで保存">PNG（今のコマ）</button>
        <button id="downloadSheet" title="全コマを並べた1枚のPNG">スプライトシート</button>
        <button id="downloadGif" title="アニメーションGIF">GIF</button>
        <button id="downloadJson" title="パレットとピクセルのデータ（再編集用）">JSON</button>
        <button id="saveHistory" title="履歴の今の項目に上書き保存">上書き保存</button>
        <button id="saveHistoryNew" title="新しい項目として履歴に保存">別名で保存</button>
      </div>

      <h2>履歴 <span class="hint">生成時に自動保存</span></h2>
      <div id="history" class="history"></div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>

  <dialog id="settingsDialog">
    <form method="dialog">
      <h2>設定</h2>
      <label>使用するAI
        <select id="providerSelect"></select>
      </label>
      <div id="providerForms"></div>
      <div class="provider-form">
        <h3>画像の読み込み</h3>
        <label>ファイルから読み込むときのサイズ
          <select id="importMode"></select>
        </label>
      </div>
      <p class="hint">APIキーはこのPCの data/settings.json に保存され、画面には表示されません。環境変数（ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENAI_API_KEY）でも指定できます。</p>
      <div class="row end">
        <button value="cancel">キャンセル</button>
        <button id="saveSettings" value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
